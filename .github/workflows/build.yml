name: Build Android APK
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libsqlite3-dev lld libffi-dev aidl
        pip install --upgrade pip
        pip install buildozer cython virtualenv

    - name: Build with Buildozer
      run: |
        # Запускаем сборку. Она создаст нужные папки SDK.
        buildozer android debug || true
        
        # Хак: исправляем путь к aidl, если Buildozer его не нашел
        if [ -d "$HOME/.buildozer/android/platform/android-sdk/build-tools" ]; then
          cd $HOME/.buildozer/android/platform/android-sdk/build-tools
          VERSION_DIR=$(ls -1 | head -n 1)
          if [ -n "$VERSION_DIR" ] && [ ! -f "$VERSION_DIR/aidl" ]; then
            echo "Linking aidl for version $VERSION_DIR"
            ln -s /usr/bin/aidl ./$VERSION_DIR/aidl || true
          fi
        fi
        
        # Запускаем сборку повторно, теперь она пройдет проверку инструментов
        buildozer android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: android-apk
        path: bin/*.apk
