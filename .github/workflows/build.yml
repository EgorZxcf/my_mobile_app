name: Build Android APK
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libsqlite3-dev lld libffi-dev aidl
        pip install --upgrade pip
        pip install buildozer cython virtualenv

    - name: Set up Java and Android SDK
      uses: android-actions/setup-android@v3
      with:
        cmdline-tools-version: 8512546 # Стабильная версия инструментов

    - name: Pre-install Android Build Tools
      run: |
        # Принудительно ставим build-tools и платформу через официальный sdkmanager
        sdkmanager "build-tools;33.0.0" "platforms;android-33"
        
        # Создаем структуру папок, которую ожидает увидеть Buildozer, 
        # и связываем её с преднастроенным Android SDK
        mkdir -p $HOME/.buildozer/android/platform
        ln -s $ANDROID_HOME $HOME/.buildozer/android/platform/android-sdk

    - name: Build with Buildozer
      run: |
        # Запускаем сборку. Теперь все инструменты уже на месте.
        buildozer android debug
        
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: android-apk
        path: bin/*.apk
