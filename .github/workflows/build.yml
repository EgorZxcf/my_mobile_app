name: Build Android APK
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libsqlite3-dev lld libffi-dev aidl autoconf automake libtool pkg-config
        pip install --upgrade pip
        pip install buildozer cython virtualenv

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK Build Tools and Fix Aidl
      run: |
        # Базовый путь к SDK на GitHub Actions
        ANDROID_HOME=/usr/local/lib/android/sdk
        
        # Обновляем sdkmanager и принудительно ставим build-tools версии 33.0.2 (под наш android.api = 33)
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;33.0.2" "platforms;android-33"

        # Настраиваем фейковый путь tools/bin для старых проверок Buildozer
        mkdir -p $ANDROID_HOME/tools/bin
        echo '#!/bin/bash' > $ANDROID_HOME/tools/bin/sdkmanager
        echo '/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "$@"' >> $ANDROID_HOME/tools/bin/sdkmanager
        chmod +x $ANDROID_HOME/tools/bin/sdkmanager

        # Создаем папку, в которой Buildozer ищет build-tools внутри своего локального окружения,
        # и делаем символическую ссылку на системный SDK, чтобы он сразу всё нашёл
        mkdir -p /home/runner/.buildozer/android/platform/android-sdk
        ln -s $ANDROID_HOME/build-tools /home/runner/.buildozer/android/platform/android-sdk/build-tools
        ln -s $ANDROID_HOME/platforms /home/runner/.buildozer/android/platform/android-sdk/platforms

        echo "Android SDK Environment successfully configured."

    - name: Build with Buildozer
      run: |
        export ANDROID_HOME=/usr/local/lib/android/sdk
        export ANDROID_NDK_HOME=/usr/local/lib/android/sdk/ndk/27.3.13750724
        export PATH=$ANDROID_HOME/tools/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/build-tools/33.0.2:$PATH
        
        # Запускаем сборку
        buildozer android debug
        
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: android-apk
        path: bin/*.apk
