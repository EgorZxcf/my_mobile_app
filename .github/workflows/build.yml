name: Build Android APK with Action
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # Используем готовый проверенный контейнер, где уже есть ВСЁ:
    # и правильный sdkmanager, и NDK, и aidl. Нам больше не нужно настраивать пути вручную!
    - name: Buildozer Action
      uses: ArtemSBulgakov/buildozer-action@v1.2.3
      with:
        workdir: .
        buildozer_version: master

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: android-apk
        path: bin/*.apk
