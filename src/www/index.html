<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #e5ddd5; display: flex; flex-direction: column; height: 100vh; }
        .header { background: #075e54; color: white; padding: 15px; text-align: center; font-size: 18px; font-weight: bold; }
        .chat-container { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .message { max-width: 75%; padding: 10px 15px; border-radius: 10px; font-size: 16px; line-height: 1.4; word-wrap: break-word; }
        .user { background: #dcf8c6; align-self: flex-end; border-top-right-radius: 0; }
        .ai { background: white; align-self: flex-start; border-top-left-radius: 0; }
        .input-panel { background: #f0f0f0; padding: 10px; display: flex; gap: 10px; align-items: center; }
        input { flex: 1; padding: 12px; border: 1px solid #ccc; border-radius: 20px; font-size: 16px; outline: none; }
        button { background: #128c7e; color: white; border: none; padding: 12px 20px; border-radius: 20px; font-size: 16px; cursor: pointer; font-weight: bold; }
        button:active { background: #075e54; }
    </style>
</head>
<body>

    <div class="header">ИИ Собеседник</div>
    
    <div class="chat-container" id="chatContainer">
        <div class="message ai">Привет! Я твой облачный ИИ-ассистент. Напиши мне что-нибудь!</div>
    </div>
    
    <div class="input-panel">
        <input type="text" id="userInput" placeholder="Введите сообщение..." onkeypress="handleKeyPress(event)">
        <button onclick="sendMessage()">Отправить</button>
    </div>

    <script>
        const chatContainer = document.getElementById('chatContainer');
        const userInput = document.getElementById('userInput');

        function appendMessage(text, sender) {
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('message', sender);
            msgDiv.innerText = text;
            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            appendMessage(text, 'user');
            userInput.value = '';

            try {
                // ОТПРАВЛЯЕМ ЗАПРОС НА ВНЕШНИЙ СЕРВЕР RENDER
                const response = await fetch('https://my-unique-ai-chat.onrender.com/ask', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });
                
                const data = await response.json();
                appendMessage(data.response, 'ai');
            } catch (error) {
                appendMessage('Ошибка связи с облачным сервером.', 'ai');
                console.error(error);
            }
        }
    </script>
</body>
</html>
